<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kai — Property Overview</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- shell.css for the design tokens, the type stack and the global nav rail.
     Everything below is this page's own. -->
<link rel="stylesheet" href="shell.css">
<style>
/* ════════════════════════════════════════════════════════════
   PROPERTY OVERVIEW
   People come here for the projects. The property's own facts are a header
   they read once and edit twice a year, so they are typeset as facts rather
   than fielded as a form — nine bordered inputs in a column is a data-entry
   screen wearing a summary's clothes, and it pushed the thing anyone came for
   below the fold.

   The whole header is one band: photo, address, specs, market. The projects
   table starts inside the first screen and takes every pixel after it.
   ════════════════════════════════════════════════════════════ */
body{background:var(--app-bg)}

/* ── top bar ──
   The address is the page's title, so it is the only thing in here at title
   size. "Property:" is gone — the rail already says Properties, and a label
   that repeats the navigation is a word you read past. */
.po-top{height:56px;background:var(--ink);display:flex;align-items:center;gap:14px;
  padding:0 20px;flex-shrink:0;position:relative;z-index:10}
.po-top-crumb{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:rgba(255,255,255,.45)}
.po-top-crumb a{color:inherit;text-decoration:none}
.po-top-crumb a:hover{color:rgba(255,255,255,.8)}
.po-sp{flex:1}
.po-org{font-size:12.5px;color:rgba(255,255,255,.72)}
.po-bell{position:relative;display:inline-flex;color:rgba(255,255,255,.72)}
.po-bell svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.5;fill:none}
.po-bell .n{position:absolute;top:-6px;right:-9px;min-width:17px;height:15px;padding:0 4px;
  background:var(--error);color:#fff;border-radius:8px;font-family:var(--mono);font-size:8.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.po-me{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.14);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:700}

/* ── page ── */
.po-page{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.po-scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 28px 40px}
.po-wrap{max-width:1280px;margin:0 auto}

/* ── the header band ──
   One row: the photo, then everything known about the property. It used to be
   three stacked cards of unequal height with a column of empty white beside
   the shortest one. */
.po-hero{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;align-items:start;
  padding-bottom:22px;border-bottom:1px solid var(--stroke);margin-bottom:6px}
.po-photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--sunken);
  border:1px solid var(--stroke)}
.po-photo-cap{position:absolute;left:0;bottom:0;padding:5px 9px;background:rgba(26,26,26,.72);
  color:#fff;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase}
.po-id{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.po-id h1{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.02em;
  line-height:1.1;margin:0}
.po-id-sub{font-size:13px;color:var(--t3);margin-top:5px}
.po-chip{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;padding:4px 9px;background:var(--accent);color:var(--ink);
  align-self:center;white-space:nowrap}
.po-chip-q{background:transparent;color:var(--t2);box-shadow:inset 0 0 0 1px var(--stroke)}

/* The facts. Label over value, no boxes — these are read far more often than
   they are typed, and the page should look like what it mostly is. */
.po-facts{margin-top:18px}
.po-facts-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.po-facts-h .lbl{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--t3)}
.po-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:15px 24px}
.po-f{min-width:0}
.po-f dt{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.po-f dd{margin:0;font-size:15px;color:var(--ink);line-height:1.25;font-variant-numeric:tabular-nums}
.po-f dd .u{font-size:11.5px;color:var(--t3);margin-left:3px;font-variant-numeric:normal}
.po-f-link{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--stroke);background:none;border:0;padding:0;cursor:pointer;font:inherit}
.po-f-link:hover{text-decoration-color:var(--ink)}

/* Edit mode: the same grid, with the values swapped for inputs. Nothing moves
   — the inputs sit exactly where the values were, so the block does not
   reflow under the cursor when you press Edit. */
.po-f input,.po-f select{display:none;width:100%;box-sizing:border-box;padding:6px 8px;
  border:1px solid var(--stroke);background:var(--white);color:var(--ink);
  font-family:var(--body);font-size:14px}
.po-f input:focus,.po-f select:focus{outline:none;border-color:var(--ink)}
body.po-editing .po-f dd{display:none}
body.po-editing .po-f input,body.po-editing .po-f select{display:block}
body.po-editing .po-f-static{display:block}

.po-btn{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 12px;border:1px solid var(--stroke);background:transparent;
  color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.po-btn:hover{border-color:var(--ink)}
.po-btn.is-primary{background:var(--accent);border-color:var(--accent-deep)}
.po-btn.is-primary:hover{background:var(--accent-deep)}
.po-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.po-facts-h .po-btn{margin-left:auto}
.po-edit-acts{display:none;gap:8px;margin-left:auto}
body.po-editing .po-edit-acts{display:flex}
body.po-editing #poEditBtn{display:none}

/* ── projects ──
   The reason for the page, so it gets the count in the heading, the filter as
   a segmented control rather than a sentence on a button, and every pixel
   below the header band. */
.po-proj-h{display:flex;align-items:center;gap:14px;padding:18px 0 12px;
  position:sticky;top:0;background:var(--app-bg);z-index:3}
.po-proj-h h2{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.015em;margin:0}
.po-count{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--t3)}
.po-seg{display:flex;margin-left:auto}
.po-seg button{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 12px;border:1px solid var(--stroke);background:transparent;
  color:var(--t3);cursor:pointer;margin-left:-1px}
.po-seg button:first-child{margin-left:0}
.po-seg button.on{background:var(--ink);border-color:var(--ink);color:#fff;position:relative;z-index:1}
.po-seg button:hover:not(.on){color:var(--ink);border-color:var(--ink);position:relative;z-index:1}

/* Hairlines, not a boxed table. The header row is the only thing that needs a
   rule under it; the rows separate themselves with one line each. */
.po-tbl{width:100%;border-collapse:collapse}
.po-tbl thead th{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--t3);text-align:left;padding:0 10px 9px;
  border-bottom:1px solid var(--stroke);white-space:nowrap;position:sticky;top:53px;
  background:var(--app-bg);z-index:2}
.po-tbl thead th.num{text-align:right}
.po-tbl thead th button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;letter-spacing:inherit;text-transform:inherit}
.po-tbl thead th button:hover{color:var(--ink)}
.po-tbl thead th svg{width:9px;height:9px;stroke:currentColor;stroke-width:2;fill:none}
.po-tbl tbody tr{border-bottom:1px solid var(--stroke);cursor:pointer;transition:background .1s}
.po-tbl tbody tr:hover{background:var(--sunken)}
.po-tbl td{padding:13px 10px;font-size:13.5px;color:var(--ink);vertical-align:middle}
.po-tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.po-tbl td.dim{color:var(--t3);font-size:12.5px;font-variant-numeric:tabular-nums}
/* The name is what people scan for, so it carries the weight and the type is
   the one thing beside it — as a quiet tag rather than its own column of
   repeated words. */
.po-name{font-weight:600}
.po-desc{display:block;font-size:12px;color:var(--t3);margin-top:2px}
.po-type{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--t3);border:1px solid var(--stroke);padding:2px 6px;
  white-space:nowrap}
.po-st{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8.5px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.po-st::before{content:'';width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;
  box-sizing:border-box}
.po-st-completed{color:var(--success)}
.po-st-completed::before{background:currentColor}
.po-st-active{color:var(--ink)}
.po-st-active::before{background:var(--accent);border-color:var(--ink)}
.po-st-draft{color:var(--t3)}
.po-st-hold{color:var(--error)}
.po-kebab{opacity:0;background:none;border:0;padding:4px;cursor:pointer;color:var(--t3);
  transition:opacity .1s,color .12s}
.po-tbl tbody tr:hover .po-kebab,.po-kebab:focus-visible{opacity:1}
.po-kebab:hover{color:var(--ink)}
.po-kebab svg{width:14px;height:14px;fill:currentColor}
.po-empty{padding:34px 10px;font-size:13px;color:var(--t3);font-style:italic}

@media (max-width:900px){
  .po-hero{grid-template-columns:minmax(0,1fr)}
  .po-photo{max-width:320px}
}
</style>
</head>

          <dl class="po-grid" id="poGrid">
            <div class="po-f"><dt>Beds</dt><dd id="v-beds">3</dd><input id="i-beds" type="number" value="3" aria-label="Beds"></div>
            <div class="po-f"><dt>Full baths</dt><dd id="v-full">3</dd><input id="i-full" type="number" value="3" aria-label="Full baths"></div>
            <div class="po-f"><dt>Half baths</dt><dd id="v-half">0</dd><input id="i-half" type="number" value="0" aria-label="Half baths"></div>
            <div class="po-f"><dt>Square feet</dt><dd id="v-sqft">1,422<span class="u">sqft</span></dd><input id="i-sqft" type="number" value="1422" aria-label="Square feet"></div>
            <div class="po-f"><dt>Acres</dt><dd id="v-acres">0.101<span class="u">acres</span></dd><input id="i-acres" type="number" step="0.001" value="0.101" aria-label="Acres"></div>
            <div class="po-f"><dt>Garage</dt><dd id="v-garage">Yes</dd>
              <select id="i-garage" aria-label="Garage"><option>Yes</option><option>No</option></select></div>
            <div class="po-f"><dt>Market</dt><dd id="v-market">Austin</dd>
              <select id="i-market" aria-label="Market"><option>Austin</option><option>Atlanta</option><option>Dallas</option><option>Phoenix</option></select></div>
            <div class="po-f"><dt>Test ID</dt><dd id="v-testid">9876</dd><input id="i-testid" value="9876" aria-label="Test ID"></div>
          </dl>
        </div>
      </div>
    </div>

    <!-- ── the reason for the page ── -->
    <div class="po-proj-h">
      <h2>Projects</h2>
      <span class="po-count" id="poCount">6 active</span>
      <div class="po-seg" id="poSeg">
        <button type="button" class="on" onclick="poFilter('active')">Active 6</button>
        <button type="button" onclick="poFilter('archived')">Archived 7</button>
      </div>
      <button class="po-btn is-primary" type="button">New project</button>
    </div>

    <table class="po-tbl">
      <thead>
        <tr>
          <th style="width:34%">Project</th>
          <th style="width:14%">Status</th>
          <th class="num" style="width:13%">Budget</th>
          <th style="width:13%">Created</th>
          <th style="width:16%">
            <button type="button" onclick="poSort()">Updated
              <svg id="poSortIco" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M3 7l3 3 3-3"/></svg>
            </button>
          </th>
          <th style="width:10%"></th>
        </tr>
      </thead>
      <tbody id="poRows"></tbody>
    </table>

  </div>
  </div>
</div>
</div>

<script>
/* The rows the screenshot shows, plus the rest of the six it counts. Dates are
   ISO here and formatted on render, so sorting is a comparison rather than a
   date parse of whatever the cell happens to say. */
var PO_PROJECTS = [
  {name:'Dashboard testing Sep 8', desc:'', type:'Acquisition', budget:10000, status:'completed', created:'2026-09-08', updated:'2026-09-11', archived:false},
  {name:'Visibility test',         desc:'', type:'Acquisition', budget:null,  status:'active',    created:'2026-09-02', updated:'2026-09-10', archived:false},
  {name:'Unit 2 full turn',        desc:'Tenant out Sep 14 · 4 rooms', type:'Turn', budget:68242, status:'active', created:'2026-08-27', updated:'2026-09-09', archived:false},
  {name:'Roof + gutter repair',    desc:'Storm damage claim', type:'Maintenance', budget:9800, status:'hold', created:'2026-08-19', updated:'2026-09-04', archived:false},
  {name:'Kitchen scope v2',        desc:'', type:'Renovation', budget:26434, status:'draft',  created:'2026-08-11', updated:'2026-08-30', archived:false},
  {name:'Exterior paint',          desc:'', type:'Maintenance', budget:5400, status:'completed', created:'2026-07-30', updated:'2026-08-22', archived:false},
  {name:'2025 make-ready',         desc:'', type:'Turn', budget:41200, status:'completed', created:'2025-11-02', updated:'2026-01-14', archived:true},
  {name:'HVAC replacement',        desc:'', type:'Maintenance', budget:7350, status:'completed', created:'2025-09-18', updated:'2025-10-02', archived:true},
  {name:'Acquisition inspection',  desc:'', type:'Acquisition', budget:1200, status:'completed', created:'2025-08-04', updated:'2025-08-20', archived:true},
  {name:'Flooring replacement',    desc:'', type:'Renovation', budget:14750, status:'completed', created:'2025-06-11', updated:'2025-07-01', archived:true},
  {name:'Landscaping refresh',     desc:'', type:'Maintenance', budget:2950, status:'completed', created:'2025-05-22', updated:'2025-06-03', archived:true},
  {name:'Water heater',            desc:'', type:'Maintenance', budget:1850, status:'completed', created:'2025-04-09', updated:'2025-04-19', archived:true},
  {name:'Initial turn 2024',       desc:'', type:'Turn', budget:38900, status:'completed', created:'2024-10-30', updated:'2025-01-08', archived:true}
];
var poView = 'active';
var poDesc = true;   // newest first

function poFmtDate(iso){
  var d = new Date(iso + 'T00:00:00');
  return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
}
/* A budget that has not been set is not zero, and "$0.00" would read as a
   decision someone made. The screenshot's own "$--" says it better. */
function poFmtMoney(n){
  if(n === null || n === undefined) return '<span class="dim">$&ndash;&ndash;</span>';
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
var PO_STATUS = {completed:'Completed', active:'Active', draft:'Draft', hold:'On hold'};

function poRender(){
  var rows = PO_PROJECTS.filter(function(p){ return p.archived === (poView === 'archived'); });
  rows.sort(function(a, b){
    return poDesc ? b.updated.localeCompare(a.updated) : a.updated.localeCompare(b.updated);
  });
  var host = document.getElementById('poRows');
  host.innerHTML = rows.length ? rows.map(function(p){
    return '<tr>'
      + '<td><span class="po-name">' + p.name + '</span>'
        + (p.desc ? '<span class="po-desc">' + p.desc + '</span>' : '') + '</td>'
      + '<td><span class="po-st po-st-' + p.status + '">' + PO_STATUS[p.status] + '</span></td>'
      + '<td class="num">' + poFmtMoney(p.budget) + '</td>'
      + '<td class="dim">' + poFmtDate(p.created) + '</td>'
      + '<td class="dim">' + poFmtDate(p.updated) + '</td>'
      + '<td class="num"><button class="po-kebab" type="button" aria-label="More actions for ' + p.name + '">'
        + '<svg viewBox="0 0 14 14"><circle cx="7" cy="3" r="1.4"/><circle cx="7" cy="7" r="1.4"/><circle cx="7" cy="11" r="1.4"/></svg>'
        + '</button></td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="6" class="po-empty">No ' + poView + ' projects on this property.</td></tr>';
  document.getElementById('poCount').textContent = rows.length + ' ' + poView;
}
function poFilter(v){
  poView = v;
  var btns = document.getElementById('poSeg').children;
  for(var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', (i === 0) === (v === 'active'));
  poRender();
}
function poSort(){
  poDesc = !poDesc;
  document.getElementById('poSortIco').style.transform = poDesc ? '' : 'rotate(180deg)';
  poRender();
}

/* Editing is a mode, not the resting state. Values and inputs occupy the same
   cells, so pressing Edit swaps them in place without the block reflowing. */
function poEdit(on){
  document.body.classList.toggle('po-editing', !!on);
  if(on){ var f = document.getElementById('i-beds'); if(f) f.focus(); }
}
function poSave(){
  var g = function(id){ return document.getElementById(id).value; };
  var s = function(id, v){ document.getElementById(id).innerHTML = v; };
  s('v-beds',   g('i-beds'));
  s('v-full',   g('i-full'));
  s('v-half',   g('i-half'));
  s('v-sqft',   Number(g('i-sqft')).toLocaleString('en-US') + '<span class="u">sqft</span>');
  s('v-acres',  g('i-acres') + '<span class="u">acres</span>');
  s('v-garage', g('i-garage'));
  s('v-market', g('i-market'));
  s('v-testid', g('i-testid'));
  document.querySelector('.po-chip').textContent = g('i-market');
  poEdit(false);
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && document.body.classList.contains('po-editing')) poEdit(false);
});
poRender();
</script>
</body>
</html>
